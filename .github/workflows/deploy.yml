name: Deploy to CloudPanel

on:
    push:
        branches: [ main ] # Changez "main" par "master" si c'est votre branche principale

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup SSH Key
          uses: webfactory/ssh-agent@v0.9.0
          with:
              ssh-private-key: ${{ secrets.CLOUDPANEL_SSH_KEY }}

        - name: Add remote server to known_hosts
          run: |
              mkdir -p ~/.ssh
              ssh-keyscan -H ${{ secrets.CLOUDPANEL_HOST }} >> ~/.ssh/known_hosts

        - name: Sync files to server via rsync
          run: |
              rsync -avz --delete \
                --exclude='.git*' \
                --exclude='.github' \
                --exclude='.env' \
                ./ ${{ secrets.CLOUDPANEL_USER }}@${{ secrets.CLOUDPANEL_HOST }}:${{ secrets.CLOUDPANEL_TARGET_DIR }}/
